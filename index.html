<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fleetsmart Management | Dispatcher Portal</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background: #f5f5f3;
    color: #161616;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.login-container {
    width: 100%;
    max-width: 1050px;
    min-height: 610px;

    display: grid;
    grid-template-columns: 1.05fr 0.95fr;

    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 24px;
    overflow: hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.08);
}

/* LEFT SIDE */

.brand-side {
    background: #ffffff;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 55px;
}

.logo {
    width: 310px;
    max-width: 80%;
    margin-bottom: 35px;
}

.brand-side h1 {
    font-size: 36px;
    font-weight: 800;
    margin-bottom: 12px;
    color: #111111;
}

.brand-side p {
    color: #777777;
    font-size: 16px;
}

/* RIGHT SIDE */

.login-side {
    background: #fafafa;
    border-left: 1px solid #eeeeee;

    padding: 70px 60px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.eyebrow {
    color: #d9a900;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;

    margin-bottom: 16px;
}

.login-side h2 {
    font-size: 38px;
    color: #111111;
    margin-bottom: 12px;
}

.subtitle {
    color: #777777;
    line-height: 1.5;
    margin-bottom: 40px;
}

/* FORM */

.field {
    margin-bottom: 22px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;

    margin-bottom: 9px;

    color: #333333;
}

input {
    width: 100%;
    height: 54px;

    padding: 0 16px;

    border: 1px solid #dddddd;
    border-radius: 11px;

    background: #ffffff;
    color: #111111;

    font-size: 15px;

    outline: none;
    transition: 0.2s;
}

input::placeholder {
    color: #aaaaaa;
}

input:focus {
    border-color: #f6c400;

    box-shadow:
        0 0 0 3px rgba(246,196,0,0.15);
}

.password-row {
    display: flex;
    justify-content: flex-end;

    margin-top: -10px;
    margin-bottom: 28px;
}

.password-row a {
    color: #666666;
    font-size: 13px;
    text-decoration: none;
}

.password-row a:hover {
    color: #c99c00;
}

/* BUTTON */

.login-button {
    width: 100%;
    height: 56px;

    border: none;
    border-radius: 11px;

    background: #f6c400;
    color: #111111;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    transition: 0.2s;
}

.login-button:hover {
    background: #ffd21a;
    transform: translateY(-1px);
}

/* FOOTER */

.footer {
    margin-top: 32px;

    text-align: center;

    color: #aaaaaa;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 850px) {

    body {
        padding: 15px;
    }

    .login-container {
        grid-template-columns: 1fr;
    }

    .brand-side {
        padding: 40px 25px;
    }

    .logo {
        width: 200px;
        margin-bottom: 20px;
    }

    .brand-side h1 {
        font-size: 27px;
    }

    .login-side {
        border-left: none;
        border-top: 1px solid #eeeeee;

        padding: 45px 30px;
    }

    .login-side h2 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <!-- LEFT -->

    <section class="brand-side">

        <img
            src="logo.svg"
            alt="Fleetsmart Management"
            class="logo"
        >

        <h1>Fleetsmart Management</h1>

        <p>
            Transportation & Dispatch Management System
        </p>

    </section>


    <!-- RIGHT -->

    <section class="login-side">

        <div class="eyebrow">
            Dispatcher Portal
        </div>

        <h2>Welcome back</h2>

        <p class="subtitle">
            Sign in to manage loads, trucks, drivers and dispatch operations.
        </p>


        <form onsubmit="demoLogin(event)">

            <div class="field">

                <label>Email address</label>

                <input
                    type="email"
                    placeholder="dispatcher@fleetsmartloads.com"
                    required
                >

            </div>


            <div class="field">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="password-row">

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Sign In
            </button>

        </form>


        <div class="footer">

            © 2026 Fleetsmart Management LLC.
            Authorized personnel only.

        </div>

    </section>

</div>


<script>

function demoLogin(event) {

    event.preventDefault();

    alert(
        "Login page ready. Authentication will be connected next."
    );

}

</script>

</body>
</html>
