<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fleetsmart Management | Dispatcher Portal</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;

      background: #f7f7f5;
      color: #111111;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    .login-container {
      width: 100%;
      max-width: 930px;
      min-height: 580px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      background: #ffffff;

      border: 1px solid #e4e4e4;
      border-radius: 22px;

      overflow: hidden;

      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.10);
    }

    /* LEFT SIDE */

    .brand-side {
      background: #ffffff;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 55px 45px;

      text-align: center;
    }

    .logo {
      width: 310px;
      max-width: 90%;
      height: auto;

      object-fit: contain;

      margin-bottom: 25px;
    }

    .brand-side h1 {
      font-size: 32px;
      font-weight: 750;

      margin-bottom: 10px;

      letter-spacing: -0.7px;
    }

    .brand-side p {
      font-size: 16px;
      color: #737373;
    }

    /* RIGHT SIDE */

    .login-side {
      background: #fafafa;

      border-left: 1px solid #eeeeee;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 60px 55px;
    }

    .portal-label {
      color: #d99f00;

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 2px;

      margin-bottom: 14px;
    }

    .login-side h2 {
      font-size: 36px;
      font-weight: 750;

      letter-spacing: -0.8px;

      margin-bottom: 12px;
    }

    .subtitle {
      color: #707070;

      font-size: 15px;
      line-height: 1.5;

      margin-bottom: 34px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;

      font-size: 14px;
      font-weight: 650;

      margin-bottom: 8px;
    }

    .field input {
      width: 100%;

      height: 52px;

      border: 1px solid #d8d8d8;
      border-radius: 10px;

      background: #ffffff;

      padding: 0 15px;

      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    .field input:focus {
      border-color: #f5bd00;

      box-shadow: 0 0 0 3px rgba(245, 189, 0, 0.12);
    }

    .field input::placeholder {
      color: #a1a1a1;
    }

    .password-row {
      text-align: right;

      margin-top: -8px;
      margin-bottom: 25px;
    }

    .password-row a {
      color: #666666;

      font-size: 13px;

      text-decoration: none;
    }

    .password-row a:hover {
      color: #111111;
    }

    .login-button {
      width: 100%;

      height: 52px;

      border: none;
      border-radius: 10px;

      background: #ffc400;
      color: #111111;

      font-size: 15px;
      font-weight: 750;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-button:hover {
      background: #f2b900;
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    #loginMessage {
      min-height: 20px;

      margin-top: 16px;

      text-align: center;

      font-size: 14px;
      font-weight: 500;
    }

    .footer {
      margin-top: 30px;

      text-align: center;

      color: #9a9a9a;

      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 760px) {

      body {
        padding: 15px;
      }

      .login-container {
        grid-template-columns: 1fr;
      }

      .brand-side {
        padding: 35px 25px;
      }

      .logo {
        width: 220px;
      }

      .brand-side h1 {
        font-size: 26px;
      }

      .login-side {
        border-left: none;
        border-top: 1px solid #eeeeee;

        padding: 40px 30px;
      }

      .login-side h2 {
        font-size: 30px;
      }
    }
  </style>
</head>


<body>

  <main class="login-container">

    <!-- LEFT SIDE -->

    <section class="brand-side">

      <img
        src="logo.svg"
        alt="Fleetsmart Management"
        class="logo"
      >

      <h1>Fleetsmart Management</h1>

      <p>
        Transportation &amp; Dispatch Management System
      </p>

    </section>


    <!-- RIGHT SIDE -->

    <section class="login-side">

      <div class="portal-label">
        DISPATCHER PORTAL
      </div>

      <h2>
        Welcome back
      </h2>

      <p class="subtitle">
        Sign in to manage loads, trucks, drivers and
        dispatch operations.
      </p>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Email address
          </label>

          <input
            id="email"
            type="email"
            placeholder="dispatcher@fleetsmartloads.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <div class="password-row">

          <a href="#" id="forgotPassword">
            Forgot password?
          </a>

        </div>


        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Sign In
        </button>


        <p id="loginMessage"></p>

      </form>


      <div class="footer">
        © 2026 Fleetsmart Management LLC.
        Authorized personnel only.
      </div>

    </section>

  </main>


  <script>

    /* ==========================
       SUPABASE
    ========================== */

    const SUPABASE_URL =
      "https://mrxweerysqyurlphyguj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8szM12j9eT7mYtUNQbl-aQ_zPp6gUFx";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ==========================
       LOGIN
    ========================== */

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "Signing In...";

        loginMessage.textContent = "";


        try {

          const { data, error } =
            await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (error) {

            console.error(error);

            loginMessage.style.color =
              "#c62828";

            loginMessage.textContent =
              "Incorrect email or password.";

            loginButton.disabled = false;

            loginButton.textContent =
              "Sign In";

            return;
          }


          if (data.session) {

            loginMessage.style.color =
              "#16803c";

            loginMessage.textContent =
              "Login successful. Opening portal...";


            setTimeout(function() {

              window.location.href =
                "dashboard.html";

            }, 500);

          }


        } catch (error) {

          console.error(error);

          loginMessage.style.color =
            "#c62828";

          loginMessage.textContent =
            "Unable to connect. Please try again.";

          loginButton.disabled = false;

          loginButton.textContent =
            "Sign In";

        }

      }
    );


    /* ==========================
       FORGOT PASSWORD
    ========================== */

    document
      .getElementById("forgotPassword")
      .addEventListener(
        "click",
        async function(event) {

          event.preventDefault();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          if (!email) {

            loginMessage.style.color =
              "#c62828";

            loginMessage.textContent =
              "Enter your email address first.";

            return;

          }


          const { error } =
            await supabaseClient.auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    "https://app.fleetsmartloads.com/"
                }
              );


          if (error) {

            console.error(error);

            loginMessage.style.color =
              "#c62828";

            loginMessage.textContent =
              "Could not send password reset email.";

          } else {

            loginMessage.style.color =
              "#16803c";

            loginMessage.textContent =
              "Password reset email sent.";

          }

        }
      );

  </script>

</body>
</html>
