<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>New Load | Fleetsmart Management</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #f5f6f8;
      color: #171717;
      min-height: 100vh;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 55px;
      height: 55px;
      object-fit: contain;
      background: white;
      padding: 6px;
      border-radius: 50%;
      border: 1px solid #e5e5e5;
    }

    .brand h1 {
      font-size: 22px;
      margin-bottom: 3px;
    }

    .brand p {
      color: #777;
      font-size: 13px;
    }

    .back-button {
      text-decoration: none;
      background: #111;
      color: #fff;
      padding: 11px 16px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid #e3e5e8;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
    }

    .card h2 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .card-subtitle {
      color: #777;
      margin-bottom: 28px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d8dadd;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 14px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #ffc400;
      box-shadow: 0 0 0 3px rgba(255,196,0,0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .cancel-button {
      background: white;
      color: #222;
      border: 1px solid #d8dadd;
      padding: 12px 18px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-button {
      background: #ffc400;
      color: #111;
      border: none;
      padding: 12px 20px;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
    }

    .save-button:hover {
      background: #f1b900;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
    }

    @media (max-width: 760px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .topbar {
        align-items: flex-start;
        gap: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="topbar">

      <div class="brand">
        <img src="logo.svg" alt="Fleetsmart">
        <div>
          <h1>Fleetsmart Management</h1>
          <p>New Load Entry</p>
        </div>
      </div>

      <a class="back-button" href="dashboard.html">
        ← Dashboard
      </a>

    </div>

    <div class="card">

      <h2>Create New Load</h2>

      <p class="card-subtitle">
        Enter the load details below.
      </p>

      <form id="loadForm">

        <div class="form-grid">

          <div class="field">
            <label for="loadNumber">Load #</label>
            <input id="loadNumber" type="text" required>
          </div>

          <div class="field">
            <label for="brokerName">Broker</label>
            <input id="brokerName" type="text">
          </div>

          <div class="field">
            <label for="truckNumber">Truck #</label>
            <input id="truckNumber" type="text">
          </div>

          <div class="field">
            <label for="driverName">Driver</label>
            <input id="driverName" type="text">
          </div>

          <div class="field">
            <label for="pickupCity">Pickup City</label>
            <input id="pickupCity" type="text" required>
          </div>

          <div class="field">
            <label for="pickupState">Pickup State</label>
            <input id="pickupState" type="text" maxlength="2">
          </div>

          <div class="field">
            <label for="pickupDate">Pickup Date</label>
            <input id="pickupDate" type="date">
          </div>

          <div class="field">
            <label for="deliveryCity">Delivery City</label>
            <input id="deliveryCity" type="text" required>
          </div>

          <div class="field">
            <label for="deliveryState">Delivery State</label>
            <input id="deliveryState" type="text" maxlength="2">
          </div>

          <div class="field">
            <label for="deliveryDate">Delivery Date</label>
            <input id="deliveryDate" type="date">
          </div>

          <div class="field">
            <label for="rate">Rate ($)</label>
            <input id="rate" type="number" step="0.01" min="0">
          </div>

          <div class="field">
            <label for="miles">Miles</label>
            <input id="miles" type="number" step="0.01" min="0">
          </div>

          <div class="field">
            <label for="status">Status</label>

            <select id="status">
              <option value="Dispatched">Dispatched</option>
              <option value="Loaded">Loaded</option>
              <option value="Transit">Transit</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>

          <div class="field full">
            <label for="notes">Notes</label>
            <textarea id="notes"></textarea>
          </div>

        </div>

        <div class="actions">

          <button
            type="button"
            class="cancel-button"
            onclick="window.location.href='dashboard.html'"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="save-button"
            id="saveButton"
          >
            Save Load
          </button>

        </div>

        <div id="message"></div>

      </form>

    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://mrxweerysqyurlphyguj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8szM12j9eT7mYtUNQbl-aQ_zPp6gUFx";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    async function protectPage() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = "index.html";
      }

    }

    protectPage();


    const loadForm =
      document.getElementById("loadForm");

    const saveButton =
      document.getElementById("saveButton");

    const message =
      document.getElementById("message");


    loadForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";
        message.textContent = "";


        const {
          data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {

          window.location.href = "index.html";
          return;

        }


        const load = {

          load_number:
            document.getElementById("loadNumber").value.trim(),

          truck_number:
            document.getElementById("truckNumber").value.trim() || null,

          driver_name:
            document.getElementById("driverName").value.trim() || null,

          broker_name:
            document.getElementById("brokerName").value.trim() || null,

          pickup_city:
            document.getElementById("pickupCity").value.trim(),

          pickup_state:
            document.getElementById("pickupState").value.trim().toUpperCase() || null,

          pickup_date:
            document.getElementById("pickupDate").value || null,

          delivery_city:
            document.getElementById("deliveryCity").value.trim(),

          delivery_state:
            document.getElementById("deliveryState").value.trim().toUpperCase() || null,

          delivery_date:
            document.getElementById("deliveryDate").value || null,

          rate:
            Number(document.getElementById("rate").value) || 0,

          miles:
            Number(document.getElementById("miles").value) || 0,

          status:
            document.getElementById("status").value,

          notes:
            document.getElementById("notes").value.trim() || null,

          created_by:
            session.user.id

        };


        const { error } =
          await supabaseClient
            .from("loads")
            .insert(load);


        if (error) {

          console.error(error);

          message.style.color = "#c62828";

          if (error.code === "23505") {
            message.textContent =
              "That load number already exists.";
          } else {
            message.textContent =
              "Could not save load. Please try again.";
          }

          saveButton.disabled = false;
          saveButton.textContent = "Save Load";

          return;

        }


        message.style.color = "#16803c";

        message.textContent =
          "Load saved successfully.";


        setTimeout(function() {

          window.location.href =
            "dashboard.html";

        }, 600);

      }
    );

  </script>

</body>
</html>
